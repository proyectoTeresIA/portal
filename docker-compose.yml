x-api-app: &api-app
  build:
    context: ./api
    args:
      RUBY_VERSION: "3.1"
      INSTALL_DEPS: "false"
  env_file:
    - .env
  environment: &api-env
    BUNDLE_PATH: /srv/ontoportal/bundle
    BUNDLE_APP_CONFIG: /srv/ontoportal/ontologies_api/.bundle
    ONTLD_PATH: /srv/ontologies_linked_data
    COVERAGE: "true"
    OVERRIDE_CONFIG: "true"
    API_KEY: ${API_KEY}
    GOO_REDIS_HOST: redis-ut
    REDIS_GOO_CACHE_HOST: redis-ut
    REDIS_HTTP_CACHE_HOST: redis-ut
    REDIS_PERSISTENT_HOST: redis-ut
    REDIS_PORT: 6379
    REDIS_HOST: redis-ut
    ANNOTATOR_REDIS_HOST: redis-ut
    ANNOTATOR_REDIS_PORT: 6379
    SOLR_TERM_SEARCH_URL: http://solr-ut:8983/solr/term_search_core1
    SOLR_PROP_SEARCH_URL: http://solr-ut:8983/solr/prop_search_core1
    SOLR_LEXICAL_SEARCH_URL: http://solr-ut:8983/solr/lexical_search_core1
    MGREP_HOST: mgrep-ut
    MGREP_PORT: 55556
  stdin_open: true
  command: bash -lc "git config --global --add safe.directory /srv/ontologies_linked_data || true; bundle check || bundle install && bundle exec unicorn -p 9393 -o 0.0.0.0"
  tty: true
  volumes:
    - api-bundle:/srv/ontoportal/bundle
    - ./api:/srv/ontoportal/ontologies_api
    - ./ontologies_linked_data:/srv/ontologies_linked_data:ro
  depends_on: &api-depends-on
    solr-ut:
      condition: service_healthy
    redis-ut:
      condition: service_healthy
    mgrep-ut:
      condition: service_healthy
  restart: unless-stopped

x-frontend-app: &frontend-app
  build:
    context: ./frontend
    args:
      RAILS_ENV: ${RAILS_ENV:-development}
      NODE_ENV: ${NODE_ENV:-development}
      BUNDLE_WITHOUT: ${BUNDLE_WITHOUT:-production test}
  command: bash -c "yarn install && yarn build && ./bin/setup && ./bin/rails s -b 0.0.0.0"
  env_file:
    - .env
  tty: true
  volumes:
    - frontend-bundle:/usr/local/bundle
    - rails_cache:/app/tmp/cache
    - assets:/app/public/assets
    - ./frontend:/app
  depends_on: &frontend-depends-on
    db:
      condition: service_healthy
    cache:
      condition: service_started
  environment: &frontend-env
    RAILS_ENV: development
    BUNDLE_WITHOUT: ""
    BUNDLE_PATH: /usr/local/bundle
    UI_URL: ${PUBLIC_UI_URL:-http://localhost}
    UI_BASE_PATH: ${PORTAL_BASE_PATH:-/teresia-portal}
    API_KEY: ${API_KEY}
    API_URL: http://portal-api:9393
    REST_URL_PREFIX: http://portal-api:9393/
    EXTERNAL_API_URL: ${EXTERNAL_API_URL:-http://localhost/teresia-portal/api}
    DB_HOST: db
    MEMCACHE_SERVERS: "cache:11211"
  tmpfs:
    - /tmp
    - /app/tmp/pids
  restart: unless-stopped

services:
  api:
    <<: *api-app
    environment:
      <<: *api-env
      BUNDLE_FROZEN: false
      GOO_BACKEND_NAME: fuseki
      GOO_PORT: 3030
      GOO_HOST: fuseki-ut
      GOO_PATH_QUERY: /ontoportal_test/query
      GOO_PATH_DATA: /ontoportal_test/data
      GOO_PATH_UPDATE: /ontoportal_test/update
    depends_on:
      <<: *api-depends-on
      fuseki-ut:
        condition: service_healthy
    networks:
      internal:
        aliases:
          - portal-api
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9393/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  ncbo-cron-worker:
    <<: *api-app
    command: bash /srv/ontoportal/ontologies_api/scripts/start-ncbo-cron.sh
    environment:
      <<: *api-env
      BUNDLE_FROZEN: false
      GOO_BACKEND_NAME: fuseki
      GOO_PORT: 3030
      GOO_HOST: fuseki-ut
      GOO_PATH_QUERY: /ontoportal_test/query
      GOO_PATH_DATA: /ontoportal_test/data
      GOO_PATH_UPDATE: /ontoportal_test/update
    depends_on:
      <<: *api-depends-on
      fuseki-ut:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - internal

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "${PORTAL_HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - internal
    restart: unless-stopped

  frontend:
    <<: *frontend-app
    environment:
      <<: *frontend-env
    networks:
      internal:
        aliases:
          - portal-frontend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      <<: *frontend-depends-on
      api:
        condition: service_healthy

  redis-ut:
    image: redis
    volumes:
      - redis-data:/data
    healthcheck:
      test: redis-cli ping
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - internal

  solr-ut:
    image: solr:8
    volumes:
      - ./api/config/solr:/configsets:ro
      - solr-data:/var/solr
    command: >
      bash -c "precreate-core term_search_core1 /configsets/term_search
      && precreate-core prop_search_core1 /configsets/property_search
      && precreate-core lexical_search_core1 /configsets/lexical_search
      && solr-foreground"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'curl -sf http://localhost:8983/solr/term_search_core1/admin/ping?wt=json | grep -iq ''"status":"OK"}'' || exit 1',
        ]
      start_period: 5s
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  mgrep-ut:
    image: ontoportal/mgrep:0.0.2
    platform: linux/amd64
    volumes:
      - ./api/test/data/dictionary.txt:/srv/mgrep/dictionary/dictionary.txt
    healthcheck:
      test: ["CMD", "nc", "-z", "-v", "127.0.0.1", "55556"]
      start_period: 3s
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  fuseki-ut:
    image: stain/jena-fuseki
    environment:
      ADMIN_PASSWORD: xyzzy
      FUSEKI_DATASET_1: ontoportal_test
    volumes:
      - fuseki-data:/fuseki
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3030/$$/ping || exit 1"]
      start_period: 20s
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - internal

  db:
    image: "mysql:8.0"
    networks:
      - internal
    environment:
      MYSQL_USER: ${MYSQL_USER:-bp_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-changeme}
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-changeme}
      MYSQL_DATABASE: bioportal_ui_development
      MYSQL_INNODB_BUFFER_POOL_SIZE: 256M
      MYSQL_INNODB_FLUSH_LOG_AT_TRX_COMMIT: 2
      MYSQL_INNODB_FLUSH_METHOD: O_DIRECT
    volumes:
      - mysql-data:/var/lib/mysql
      - ./frontend/db/init-mysql.sh:/docker-entrypoint-initdb.d/init-mysql.sh
    command: >
      --default-authentication-plugin=mysql_native_password
      --innodb-buffer-pool-size=256M --innodb-redo-log-capacity=134217728
      --innodb-flush-log-at-trx-commit=2 --innodb-flush-method=O_DIRECT
      --max-connections=200 --slow-query-log=1 --long-query-time=2
      --binlog-expire-logs-seconds=604800 --max-binlog-size=100M
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_PASSWORD:-changeme}",
        ]
      timeout: 10s
      retries: 5
      interval: 30s
      start_period: 60s

  cache:
    image: memcached:latest
    restart: unless-stopped
    command: ["-m", "1024"]
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  api-bundle:
    name: ontoportal_api_bundle
    driver: local
  frontend-bundle:
  mysql-data:
    name: portal_mysql_persistent
    external: true
  rails_cache:
  assets:
  redis-data:
    name: portal_redis_persistent
    driver: local
  solr-data:
    name: portal_solr_persistent
    driver: local
  fuseki-data:
    name: portal_fuseki_persistent
    driver: local
