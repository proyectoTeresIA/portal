x-api-app: &api-app
  build:
    context: ./api
    args:
      RUBY_VERSION: "3.1"
      INSTALL_DEPS: "false"
  env_file:
    - .env
  environment: &api-env
    BUNDLE_PATH: /srv/ontoportal/bundle
    BUNDLE_APP_CONFIG: /srv/ontoportal/ontologies_api/.bundle
    ONTLD_PATH: /srv/ontologies_linked_data
    COVERAGE: "true"
    OVERRIDE_CONFIG: "true"
    API_KEY: ${API_KEY}
    GOO_REDIS_HOST: redis-ut
    REDIS_GOO_CACHE_HOST: redis-ut
    REDIS_HTTP_CACHE_HOST: redis-ut
    REDIS_PERSISTENT_HOST: redis-ut
    REDIS_PORT: 6379
    REDIS_HOST: redis-ut
    ANNOTATOR_REDIS_HOST: redis-ut
    ANNOTATOR_REDIS_PORT: 6379
    SOLR_TERM_SEARCH_URL: http://solr-ut:8983/solr/term_search_core1
    SOLR_PROP_SEARCH_URL: http://solr-ut:8983/solr/prop_search_core1
    SOLR_LEXICAL_SEARCH_URL: http://solr-ut:8983/solr/lexical_search_core1
    MGREP_HOST: mgrep-ut
    MGREP_PORT: 55556
  stdin_open: true
  command: bash -lc "git config --global --add safe.directory /srv/ontologies_linked_data || true; bundle check || bundle install && bundle exec unicorn -p 9393 -o 0.0.0.0"
  tty: true
  volumes:
    - api-bundle:/srv/ontoportal/bundle
    - ./api:/srv/ontoportal/ontologies_api
    - ./ontologies_linked_data:/srv/ontologies_linked_data:ro
  depends_on: &api-depends-on
    solr-ut:
      condition: service_healthy
    redis-ut:
      condition: service_healthy
    mgrep-ut:
      condition: service_healthy

x-frontend-app: &frontend-app
  build:
    context: ./frontend
    args:
      RAILS_ENV: ${RAILS_ENV:-development}
      NODE_ENV: ${NODE_ENV:-development}
      BUNDLE_WITHOUT: ${BUNDLE_WITHOUT:-production test}
  command: bash -c "./bin/setup && ./bin/rails s -b 0.0.0.0"
  env_file:
    - .env
  tty: true
  volumes:
    - frontend-bundle:/usr/local/bundle
    - rails_cache:/app/tmp/cache
    - assets:/app/public/assets
    - ./frontend:/app
  depends_on: &frontend-depends-on
    db:
      condition: service_healthy
    cache:
      condition: service_started
  environment: &frontend-env
    RAILS_ENV: development
    BUNDLE_WITHOUT: ""
    BUNDLE_PATH: /usr/local/bundle
    API_KEY: ${API_KEY}
    DB_HOST: db
    MEMCACHE_SERVERS: "cache:11211"
  tmpfs:
    - /tmp
    - /app/tmp/pids

services:
  # API Services
  api:
    <<: *api-app
    environment:
      <<: *api-env
      GOO_BACKEND_NAME: 4store
      GOO_PORT: 9000
      GOO_HOST: store4
      GOO_PATH_QUERY: /sparql/
      GOO_PATH_DATA: /data/
      GOO_PATH_UPDATE: /update/
      BUNDLE_FROZEN: false
    profiles:
      - 4store
    depends_on:
      <<: *api-depends-on
      store4:
        condition: service_started
    networks:
      internal:
        aliases:
          - api
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9393/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # NcboCron Worker Service for processing ontologies (4store)
  ncbo-cron-worker-4store:
    <<: *api-app
    command: bash /srv/ontoportal/ontologies_api/scripts/start-ncbo-cron.sh
    environment:
      <<: *api-env
      GOO_BACKEND_NAME: 4store
      GOO_PORT: 9000
      GOO_HOST: store4
      GOO_PATH_QUERY: /sparql/
      GOO_PATH_DATA: /data/
      GOO_PATH_UPDATE: /update/
    profiles:
      - 4store
    depends_on:
      <<: *api-depends-on
      store4:
        condition: service_started
      api:
        condition: service_healthy
    networks:
      - internal

  api-agraph:
    <<: *api-app
    environment:
      <<: *api-env
      GOO_BACKEND_NAME: ag
      GOO_PORT: 10035
      GOO_HOST: agraph-ut
      GOO_PATH_QUERY: /repositories/ontoportal_test
      GOO_PATH_DATA: /repositories/ontoportal_test/statements
      GOO_PATH_UPDATE: /repositories/ontoportal_test/statements
    profiles:
      - agraph
    depends_on:
      <<: *api-depends-on
      agraph-ut:
        condition: service_healthy
    networks:
      internal:
        aliases:
          - api
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9393/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # NcboCron Worker Service for processing ontologies
  ncbo-cron-worker:
    <<: *api-app
    command: bash /srv/ontoportal/ontologies_api/scripts/start-ncbo-cron.sh
    environment:
      <<: *api-env
      GOO_BACKEND_NAME: ag
      GOO_PORT: 10035
      GOO_HOST: agraph-ut
      GOO_PATH_QUERY: /repositories/ontoportal_test
      GOO_PATH_DATA: /repositories/ontoportal_test/statements
      GOO_PATH_UPDATE: /repositories/ontoportal_test/statements
    profiles:
      - agraph
    depends_on:
      <<: *api-depends-on
      agraph-ut:
        condition: service_healthy
      api-agraph:
        condition: service_healthy
    networks:
      - internal

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
    networks:
      - internal
    restart: unless-stopped
    profiles:
      - 4store
      - agraph

  # Frontend Services
  frontend:
    <<: *frontend-app
    environment:
      <<: *frontend-env
    networks:
      internal:
        aliases:
          - frontend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      <<: *frontend-depends-on
      frontend-node:
        condition: service_started
      api:
        condition: service_started
    profiles:
      - 4store

  frontend-agraph:
    <<: *frontend-app
    environment:
      <<: *frontend-env
    networks:
      internal:
        aliases:
          - frontend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      <<: *frontend-depends-on
      frontend-node:
        condition: service_started
      api-agraph:
        condition: service_started
    profiles:
      - agraph

  frontend-node:
    <<: *frontend-app
    command: bash -c "yarn install && yarn build --watch"
    networks:
      - internal

  frontend-test:
    <<: *frontend-app
    command: "./bin/rails console"
    environment:
      <<: *frontend-env
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started
      chrome-server:
        condition: service_started
    networks:
      - internal
      - external

  # Shared Infrastructure Services
  redis-ut:
    image: redis
    # No host port bindings to avoid conflicts with other stacks; reachable via internal network
    volumes:
      - redis-data:/data
    healthcheck:
      test: redis-cli ping
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - internal

  store4:
    image: bde2020/4store
    platform: linux/arm64
    ports:
      - "8081:9000"
    volumes:
      - 4store-data:/var/lib/4store
    command: >
      bash -c "4s-backend-setup --segments 4 ontoportal_kb
      && 4s-backend ontoportal_kb
      && 4s-httpd -D -s-1 -p 9000 ontoportal_kb"
    profiles:
      - 4store
    networks:
      - internal

  solr-ut:
    image: solr:8
    volumes:
      - ./api/config/solr:/configsets:ro
      - solr-data:/var/solr
    # No host port binding to avoid conflicts with other stacks; reachable via internal network
    command: >
      bash -c "precreate-core term_search_core1 /configsets/term_search
      && precreate-core prop_search_core1 /configsets/property_search
      && precreate-core lexical_search_core1 /configsets/lexical_search
      && solr-foreground"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'curl -sf http://localhost:8983/solr/term_search_core1/admin/ping?wt=json | grep -iq ''"status":"OK"}'' || exit 1',
        ]
      start_period: 5s
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  mgrep-ut:
    image: ontoportal/mgrep:0.0.2
    platform: linux/amd64
    volumes:
      - ./api/test/data/dictionary.txt:/srv/mgrep/dictionary/dictionary.txt
    healthcheck:
      test: ["CMD", "nc", "-z", "-v", "127.0.0.1", "55556"]
      start_period: 3s
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  agraph-ut:
    image: franzinc/agraph:v8.1.0
    platform: linux/amd64
    environment:
      - AGRAPH_SUPER_USER=test
      - AGRAPH_SUPER_PASSWORD=xyzzy
    shm_size: 1g
    volumes:
      - agraph-data:/agraph/data
    ports:
      - "10035:10035"
    command: >
      bash -c "/agraph/bin/agraph-control --config /agraph/etc/agraph.cfg start
      ; agtool repos create ontoportal_test
      ; agtool users add anonymous
      ; agtool users grant anonymous root:ontoportal_test:rw
      ; tail -f /agraph/data/agraph.log"
    healthcheck:
      test: ["CMD-SHELL", "agtool storage-report ontoportal_test || exit 1"]
      start_period: 30s
      interval: 20s
      timeout: 10s
      retries: 10
    profiles:
      - agraph
    networks:
      - internal

  db:
    image: "mysql:8.0"
    networks:
      - internal
    ports:
      - "3306:3306"
    environment:
      MYSQL_USER: ${MYSQL_USER:-bp_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-changeme}
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-changeme}
      MYSQL_DATABASE: bioportal_ui_development
      MYSQL_INNODB_BUFFER_POOL_SIZE: 256M
      MYSQL_INNODB_FLUSH_LOG_AT_TRX_COMMIT: 2
      MYSQL_INNODB_FLUSH_METHOD: O_DIRECT
    volumes:
      - mysql-data:/var/lib/mysql
      - ./frontend/db/init-mysql.sh:/docker-entrypoint-initdb.d/init-mysql.sh
    command: >
      --default-authentication-plugin=mysql_native_password
      --innodb-buffer-pool-size=256M
      --innodb-redo-log-capacity=134217728
      --innodb-flush-log-at-trx-commit=2
      --innodb-flush-method=O_DIRECT
      --max-connections=200
      --slow-query-log=1
      --long-query-time=2
      --binlog-expire-logs-seconds=604800
      --max-binlog-size=100M
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_PASSWORD:-changeme}",
        ]
      timeout: 10s
      retries: 5
      interval: 30s
      start_period: 60s

  cache:
    image: memcached:latest
    restart: unless-stopped
    command: ["-m", "1024"]
    networks:
      - internal
    ports:
      - "11211:11211"

  chrome-server:
    image: selenium/standalone-chrome:112.0-chromedriver-112.0-grid-4.9.0-20230421
    platform: linux/amd64
    shm_size: 2g
    network_mode: "host"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    profiles:
      - not_integrated
    networks:
      - internal

  neo4j:
    image: neo4j:5.13-community
    container_name: neo4j
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_dbms_memory_pagecache_size=1G
      - NEO4J_dbms_memory_heap_initial__size=1G
      - NEO4J_dbms_memory_heap_max__size=1G
    ports:
      - "7474:7474" # HTTP
      - "7687:7687" # Bolt
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
      - neo4j-import:/var/lib/neo4j/import
      - neo4j-plugins:/plugins
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "password", "RETURN 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    profiles:
      - not_integrated
    networks:
      - internal

networks:
  internal:
  external:

volumes:
  api-bundle:
    name: ontoportal_api_bundle
    driver: local
  frontend-bundle:
  mysql-data:
    name: portal_mysql_persistent
    external: true
  rails_cache:
  assets:
  elasticsearch-data:
    name: portal_elasticsearch_persistent
    driver: local
  neo4j-data:
    name: portal_neo4j_data_persistent
    driver: local
  neo4j-logs:
    name: portal_neo4j_logs_persistent
    driver: local
  neo4j-import:
    name: portal_neo4j_import_persistent
    driver: local
  neo4j-plugins:
    name: portal_neo4j_plugins_persistent
    driver: local
  redis-data:
    name: portal_redis_persistent
    driver: local
  4store-data:
    name: portal_4store_persistent
    driver: local
  solr-data:
    name: portal_solr_persistent
    driver: local
  agraph-data:
    name: portal_agraph_persistent
    driver: local
