name: Build and publish Docker images

on:
  push:
    branches: [prod]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_API: proyectoteresia/portal/api
  IMAGE_NAME_UI: proyectoteresia/portal/frontend

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Debug workspace contents
        run: |
          echo "Root contents:" && ls -la
          echo "Submodule status:" && git submodule status || true
          echo "API dir:" && ls -la api || true
          echo "Frontend dir:" && ls -la frontend || true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare tags
        id: prep
        run: |
          REF=${GITHUB_REF##*/}
          SHA=${GITHUB_SHA::7}
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            TAGS="pr-${{ github.event.number }}-$SHA"
          elif [ "${REF}" = "prod" ]; then
            TAGS="latest $SHA"
          else
            TAGS="$REF $SHA"
          fi

          API_PREFIX="${REGISTRY}/${IMAGE_NAME_API}"
          UI_PREFIX="${REGISTRY}/${IMAGE_NAME_UI}"

          # Ensure repository/image names are lowercase (OCI requirement)
          API_PREFIX=$(echo "$API_PREFIX" | tr '[:upper:]' '[:lower:]')
          UI_PREFIX=$(echo "$UI_PREFIX" | tr '[:upper:]' '[:lower:]')

          {
            echo 'api_tags<<EOF'
            for tag in $TAGS; do
              echo "${API_PREFIX}:$tag"
            done
            echo EOF
          } >> "$GITHUB_OUTPUT"

          {
            echo 'ui_tags<<EOF'
            for tag in $TAGS; do
              echo "${UI_PREFIX}:$tag"
            done
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          args: |
            INSTALL_DEPS=true
          push: true
          tags: |
            ${{ steps.prep.outputs.api_tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ steps.prep.outputs.ui_tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Production
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          port: ${{ secrets.VM_PORT }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /app/portal

            docker compose -f docker-compose.production.yml --profile 4store pull
            docker -f docker-compose.production.yml --profile 4store rollout api ncbo-cron-worker frontend

            docker image prune -f
