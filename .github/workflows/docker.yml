name: Build and publish Docker images

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_API: ${{ github.repository }}/api-agraph
  IMAGE_NAME_UI: ${{ github.repository }}/frontend-dev-agraph

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare tags
        id: prep
        run: |
          REF=${GITHUB_REF##*/}
          SHA=${GITHUB_SHA::7}
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            echo "tags=pr-${{ github.event.number }}-$SHA" >> $GITHUB_OUTPUT
          elif [ "${REF}" = "main" ]; then
            echo "tags=latest,$SHA" >> $GITHUB_OUTPUT
          else
            echo "tags=$REF,$SHA" >> $GITHUB_OUTPUT
          fi

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.prep.outputs.tags && format('{0}', join(fromJSON('[''' + join(replace(steps.prep.outputs.tags, ',', '\u0027,\u0027'), ''')])) ) }}
          labels: |
            org.opencontainers.image.source=${{ github.repositoryUrl }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.prep.outputs.tags && format('{0}', join(fromJSON('[''' + join(replace(steps.prep.outputs.tags, ',', '\u0027,\u0027'), ''')])) ) }}
          labels: |
            org.opencontainers.image.source=${{ github.repositoryUrl }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
