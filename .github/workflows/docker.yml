name: Build and publish Docker images

on:
  push:
    branches: [prod]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_API: ${{ github.repository }}/api-agraph
  IMAGE_NAME_UI: ${{ github.repository }}/frontend-dev-agraph

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare tags
        id: prep
        run: |
          REF=${GITHUB_REF##*/}
          SHA=${GITHUB_SHA::7}
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            TAGS="pr-${{ github.event.number }}-$SHA"
          elif [ "${REF}" = "prod" ]; then
            TAGS="latest $SHA"
          else
            TAGS="$REF $SHA"
          fi

          API_PREFIX="${REGISTRY}/${IMAGE_NAME_API}"
          UI_PREFIX="${REGISTRY}/${IMAGE_NAME_UI}"

          # Ensure repository/image names are lowercase (OCI requirement)
          API_PREFIX=$(echo "$API_PREFIX" | tr '[:upper:]' '[:lower:]')
          UI_PREFIX=$(echo "$UI_PREFIX" | tr '[:upper:]' '[:lower:]')

          {
            echo 'api_tags<<EOF'
            for tag in $TAGS; do
              echo "${API_PREFIX}:$tag"
            done
            echo EOF
          } >> "$GITHUB_OUTPUT"

          {
            echo 'ui_tags<<EOF'
            for tag in $TAGS; do
              echo "${UI_PREFIX}:$tag"
            done
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          tags: |
            ${{ steps.prep.outputs.api_tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ steps.prep.outputs.ui_tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
