x-api-app: &api-app
  image: ${API_IMAGE:-ghcr.io/proyectoteresia/portal/api:latest}
  env_file:
    - .env
  environment: &api-env
    # Ruby/Bundler
    BUNDLE_PATH: /srv/ontoportal/bundle
    BUNDLE_APP_CONFIG: /srv/ontoportal/ontologies_api/.bundle
    BUNDLE_WITHOUT: "development test"

    # App
    BASE_PATH: /metabuscador/api
    RACK_ENV: production
    COVERAGE: "false"
    OVERRIDE_CONFIG: "true"
    API_KEY: ${API_KEY}

    # Redis/Solr/Mgrep
    GOO_REDIS_HOST: redis-ut
    REDIS_GOO_CACHE_HOST: redis-ut
    REDIS_HTTP_CACHE_HOST: redis-ut
    REDIS_PERSISTENT_HOST: redis-ut
    REDIS_PORT: 6379
    REDIS_HOST: redis-ut
    ANNOTATOR_REDIS_HOST: redis-ut
    ANNOTATOR_REDIS_PORT: 6379
    SOLR_TERM_SEARCH_URL: http://solr-ut:8983/solr/term_search_core1
    SOLR_PROP_SEARCH_URL: http://solr-ut:8983/solr/prop_search_core1
    SOLR_LEXICAL_SEARCH_URL: http://solr-ut:8983/solr/lexical_search_core1
    MGREP_HOST: mgrep-ut
    MGREP_PORT: 55556
    REPORT_PATH: /reports/ontologies_report.json
    REPOSITORY_FOLDER: /srv/ontoportal/data/repository
    DATADIR: /
  command: "bundle exec unicorn -p 9393 -o 0.0.0.0"
  restart: unless-stopped
  volumes:
    - reports-data:/reports
    - repository-data:/srv/ontoportal/data/repository
    - mgrep-dictionary:/srv/ontoportal/ontologies_api/test/data
    - api-logs:/srv/ontoportal/ontologies_api/log
  depends_on: &api-depends-on
    solr-ut:
      condition: service_healthy
    redis-ut:
      condition: service_healthy
    mgrep-ut:
      condition: service_healthy
  networks:
    internal:
      aliases:
        - api
  healthcheck:
    test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/9393 && exec 3>&-"]
    interval: 60s
    timeout: 10s
    retries: 3
    start_period: 120s
  labels:
    autoheal: "true"

x-frontend-app: &frontend-app
  image: ${FRONTEND_IMAGE:-ghcr.io/proyectoteresia/portal/frontend:latest}
  command: bash -c "./bin/setup && ./bin/rails s -b 0.0.0.0"
  env_file:
    - .env
  environment:
    RAILS_ENV: production
    NODE_ENV: production
    BUNDLE_WITHOUT: "development test"
    BUNDLE_PATH: /usr/local/bundle
    BASE_PATH: /metabuscador
    API_KEY: ${API_KEY}
    DB_HOST: db
    MEMCACHE_SERVERS: "cache:11211"
  restart: unless-stopped
  volumes:
    - frontend-bundle:/usr/local/bundle
    - rails_cache:/app/tmp/cache
  depends_on: &frontend-depends-on
    db:
      condition: service_healthy
    cache:
      condition: service_started
  tmpfs:
    - /tmp
    - /app/tmp/pids
  healthcheck:
    test: ["CMD-SHELL", "curl -f http://localhost:3000/metabuscador/ || exit 1"]
    interval: 30s
    timeout: 10s
    retries: 5
    start_period: 60s
  labels:
    autoheal: "true"

services:
  # API Services (4store)
  api:
    <<: *api-app
    environment:
      <<: *api-env
      GOO_BACKEND_NAME: 4store
      GOO_PORT: 9000
      GOO_HOST: 4store-ut
      GOO_PATH_QUERY: /sparql/
      GOO_PATH_DATA: /data/
      GOO_PATH_UPDATE: /update/
    profiles:
      - 4store
    depends_on:
      <<: *api-depends-on
      4store-ut:
        condition: service_healthy

  # NcboCron Worker Service for processing ontologies (4store)
  ncbo-cron-worker:
    <<: *api-app
    command: bash /srv/ontoportal/ontologies_api/scripts/start-ncbo-cron.sh
    environment:
      <<: *api-env
      GOO_BACKEND_NAME: 4store
      GOO_PORT: 9001        # secondary httpd worker — isolates indexing from user API
      GOO_HOST: 4store-ut
      GOO_PATH_QUERY: /sparql/
      GOO_PATH_DATA: /data/
      GOO_PATH_UPDATE: /update/
    profiles:
      - 4store
    depends_on:
      <<: *api-depends-on
      4store-ut:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f ruby > /dev/null || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

  # API Services (AllegroGraph)
  api-agraph:
    <<: *api-app
    environment:
      <<: *api-env
      GOO_BACKEND_NAME: ag
      GOO_PORT: 10035
      GOO_HOST: agraph-ut
      GOO_PATH_QUERY: /repositories/ontoportal_test
      GOO_PATH_DATA: /repositories/ontoportal_test/statements
      GOO_PATH_UPDATE: /repositories/ontoportal_test/statements
    profiles:
      - agraph
    depends_on:
      <<: *api-depends-on
      agraph-ut:
        condition: service_healthy

  # NcboCron Worker Service for processing ontologies (AG)
  ncbo-cron-worker-agraph:
    <<: *api-app
    command: bash /srv/ontoportal/ontologies_api/scripts/start-ncbo-cron.sh
    environment:
      <<: *api-env
      GOO_BACKEND_NAME: ag
      GOO_PORT: 10035
      GOO_HOST: agraph-ut
      GOO_PATH_QUERY: /repositories/ontoportal_test
      GOO_PATH_DATA: /repositories/ontoportal_test/statements
      GOO_PATH_UPDATE: /repositories/ontoportal_test/statements
    profiles:
      - agraph
    depends_on:
      <<: *api-depends-on
      agraph-ut:
        condition: service_healthy
      api-agraph:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f ruby > /dev/null || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

  # Frontend Services
  frontend:
    <<: *frontend-app
    networks:
      internal:
        aliases:
          - frontend
    depends_on:
      <<: *frontend-depends-on
      api:
        condition: service_started
    profiles:
      - 4store

  frontend-agraph:
    <<: *frontend-app
    networks:
      internal:
        aliases:
          - frontend
    depends_on:
      <<: *frontend-depends-on
      api-agraph:
        condition: service_started
    profiles:
      - agraph

  # Shared Infrastructure Services
  redis-ut:
    image: redis:7
    restart: unless-stopped
    command: redis-server --appendonly yes --appendfsync everysec
    ports:
      - "6379:6379"
      - "6380:6379"
      - "6381:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    labels:
      autoheal: "true"
    networks:
      - internal

  4store-ut:
    image: bde2020/4store
    restart: unless-stopped
    platform: linux/amd64
    entrypoint: ["/bin/bash", "-c"]
    command: >
      "if [ ! -d /var/lib/4store/ontoportal_kb ]; then
         4s-backend-setup --node 0 --cluster 1 --segments 8 ontoportal_kb;
       fi &&
       4s-backend ontoportal_kb &&
       sleep 2 &&
       4s-httpd -D -U -s-1 -p 9001 ontoportal_kb &
       4s-httpd -D -U -s-1 -p 9000 ontoportal_kb"
    ports:
      - "8081:9000"
    volumes:
      - 4store-data:/var/lib/4store
    healthcheck:
      test: ["CMD", "bash", "-c",
             "exec 3<>/dev/tcp/localhost/9000 && exec 3>&- &&
              exec 4<>/dev/tcp/localhost/9001 && exec 4>&-"]
      start_period: 30s
      interval: 30s
      timeout: 120s
      retries: 5
    labels:
      autoheal: "true"
    profiles:
      - 4store
    networks:
      - internal

  solr-ut:
    image: solr:8
    restart: unless-stopped
    volumes:
      - ./api/config/solr:/configsets:ro
      - solr-data:/var/solr
    ports:
      - "8983:8983"
    command: >
      bash -c "precreate-core term_search_core1 /configsets/term_search &&
      precreate-core prop_search_core1 /configsets/property_search &&
      precreate-core lexical_search_core1 /configsets/lexical_search &&
      solr-foreground"
    healthcheck:
      test: [
          "CMD-SHELL",
          'curl -sf
          http://localhost:8983/solr/term_search_core1/admin/ping?wt=json |
          grep -iq ''"status":"OK"}'' || exit 1',
        ]
      start_period: 5s
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      autoheal: "true"
    networks:
      - internal

  mgrep-ut:
    image: ontoportal/mgrep:0.0.2
    restart: unless-stopped
    platform: linux/amd64
    command: /start-mgrep.sh
    volumes:
      - mgrep-dictionary:/srv/mgrep/dictionary
      - ./mgrep/start-mgrep.sh:/start-mgrep.sh:ro
    healthcheck:
      test: ["CMD", "nc", "-z", "-v", "127.0.0.1", "55556"]
      start_period: 3s
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      autoheal: "true"
    networks:
      - internal

  agraph-ut:
    image: franzinc/agraph:v8.1.0
    restart: unless-stopped
    platform: linux/amd64
    environment:
      - AGRAPH_SUPER_USER=test
      - AGRAPH_SUPER_PASSWORD=xyzzy
    shm_size: 1g
    volumes:
      - agraph-data:/agraph/data
    command: >
      bash -c "/agraph/bin/agraph-control --config /agraph/etc/agraph.cfg start
      ; agtool repos create ontoportal_test ; agtool users add anonymous ;
      agtool users grant anonymous root:ontoportal_test:rw ; tail -f
      /agraph/data/agraph.log"
    healthcheck:
      test: ["CMD-SHELL", "agtool storage-report ontoportal_test || exit 1"]
      start_period: 30s
      interval: 20s
      timeout: 10s
      retries: 10
    labels:
      autoheal: "true"
    profiles:
      - agraph
    networks:
      - internal

  db:
    image: mysql:8.0
    networks:
      - internal
    ports:
      - "3306:3306"
    environment:
      MYSQL_USER: ${MYSQL_USER:-bp_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-changeme}
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-changeme}
      MYSQL_DATABASE: bioportal_ui_production
      MYSQL_INNODB_BUFFER_POOL_SIZE: 256M
      MYSQL_INNODB_FLUSH_LOG_AT_TRX_COMMIT: 2
      MYSQL_INNODB_FLUSH_METHOD: O_DIRECT
    volumes:
      - mysql-data:/var/lib/mysql
      - ./frontend/db/init-mysql.sh:/docker-entrypoint-initdb.d/init-mysql.sh
    command: >
      --default-authentication-plugin=mysql_native_password
      --innodb-buffer-pool-size=256M --innodb-redo-log-capacity=134217728
      --innodb-flush-log-at-trx-commit=2 --innodb-flush-method=O_DIRECT
      --max-connections=200 --slow-query-log=1 --long-query-time=2
      --binlog-expire-logs-seconds=604800 --max-binlog-size=100M
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_PASSWORD:-changeme}",
        ]
      timeout: 10s
      retries: 5
      interval: 30s
      start_period: 60s
    labels:
      autoheal: "true"

  cache:
    image: memcached:latest
    restart: unless-stopped
    command: ["-m", "1024"]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/11211 && printf 'stats\\r\\n' >&3 && head -1 <&3 | grep -q 'STAT'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    labels:
      autoheal: "true"
    networks:
      - internal
    ports:
      - "11211:11211"

  autoheal:
    image: willfarrell/autoheal:latest
    restart: unless-stopped
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=30
      - AUTOHEAL_START_PERIOD=0
      - AUTOHEAL_DEFAULT_STOP_TIMEOUT=10
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

networks:
  internal:
    name: ontoportal_internal
  external:

volumes:
  mysql-data:
    name: portal_mysql
    external: true
  redis-data:
    name: portal_redis
    driver: local
  4store-data-single:
    name: portal_4store_single
    driver: local
  # Legacy volumes kept for reference — no longer mounted by any service
  4store-data:
    name: portal_4store
    driver: local
  4store-data-node1:
    name: portal_4store_node1
    driver: local
  4store-data-node2:
    name: portal_4store_node2
    driver: local
  4store-data-node3:
    name: portal_4store_node3
    driver: local
  solr-data:
    name: portal_solr
    driver: local
  agraph-data:
    name: portal_agraph
    driver: local
  frontend-bundle:
    name: ontoportal_frontend_bundle
    driver: local
  rails_cache:
  assets:
  reports-data:
    name: portal_reports
    driver: local
  repository-data:
    name: portal_repository
    driver: local
  mgrep-dictionary:
    name: portal_mgrep_dictionary
    driver: local
  api-logs:
    name: portal_api_logs
    driver: local