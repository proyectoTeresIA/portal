events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Preserve original scheme when running behind an upstream reverse proxy.
    map $http_x_forwarded_proto $origin_proto {
        default $scheme;
        ~*^https$ https;
        ~*^http$ http;
    }

    resolver 127.0.0.11 valid=30s ipv6=off;

    merge_slashes off;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Basic settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 500M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    server {
        listen 80;
        server_name _;

        # Health check
        location /nginx-health {
            access_log off;
            return 200 "nginx healthy\n";
            add_header Content-Type text/plain;
        }

        location = /teresia-portal {
            return 302 $scheme://$http_host/teresia-portal/;
        }

        # -----------------------------------------------------------------------
        # API
        # -----------------------------------------------------------------------
        location /teresia-portal/api/ {
            set $api_host portal-api;
            rewrite ^/teresia-portal/api/(.*)$ /$1 break;

            proxy_pass http://$api_host:9393;
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_set_header Host                $http_host;
            proxy_set_header X-Forwarded-Host    $http_host;
            proxy_set_header X-Forwarded-Port    $server_port;
            proxy_set_header X-Real-IP           $remote_addr;
            proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto   $origin_proto;
            proxy_set_header X-Forwarded-Prefix /teresia-portal;
            proxy_connect_timeout 60s;
            proxy_send_timeout    60s;
            proxy_set_header X-Script-Name /teresia-portal;
            proxy_read_timeout    60s;

            # CORS
            add_header Access-Control-Allow-Origin  *;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization";

            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin  *;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
                add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization";
                add_header Access-Control-Max-Age   1728000;
                add_header Content-Type             'text/plain charset=UTF-8';
                add_header Content-Length           0;
                return 204;
            }
        }

        location /teresia-portal/analytics {
            set $api_host portal-api;
            rewrite ^/teresia-portal(/analytics.*)$ $1 break;
            proxy_pass http://$api_host:9393;
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_set_header Host                $http_host;
            proxy_set_header X-Forwarded-Host    $http_host;
            proxy_set_header X-Forwarded-Port    $server_port;
            proxy_set_header X-Real-IP           $remote_addr;
            proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto   $origin_proto;
            proxy_connect_timeout 60s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
        }

        location /teresia-portal/static {
            set $api_host portal-api;
            rewrite ^/teresia-portal(/static.*)$ $1 break;
            proxy_pass http://$api_host:9393;
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_set_header Host                $http_host;
            proxy_set_header X-Forwarded-Host    $http_host;
            proxy_set_header X-Forwarded-Port    $server_port;
            proxy_set_header X-Real-IP           $remote_addr;
            proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto   $origin_proto;
            proxy_connect_timeout 60s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
        }

        # -----------------------------------------------------------------------
        # Frontend Rails
        # -----------------------------------------------------------------------
        location /teresia-portal/ {
            set $frontend_host portal-frontend;
            proxy_pass http://$frontend_host:3000;
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 5;
            proxy_next_upstream_timeout 20s;
            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $origin_proto;

            proxy_cookie_path / /teresia-portal/;
            proxy_set_header SCRIPT_NAME       /teresia-portal;

            # Timeouts for big file uploads/downloads
            proxy_connect_timeout  300s;
            proxy_send_timeout     300s;
            proxy_read_timeout     300s;
            proxy_request_buffering off;
        }

        # Frontend static/runtime paths generated at root (e.g. /assets/*)
        location / {
            set $frontend_host portal-frontend;
            proxy_pass http://$frontend_host:3000;
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 5;
            proxy_next_upstream_timeout 20s;
            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $origin_proto;
            proxy_set_header X-Forwarded-Ssl   on;

            proxy_connect_timeout  300s;
            proxy_send_timeout     300s;
            proxy_read_timeout     300s;
            proxy_request_buffering off;
        }

    }
}