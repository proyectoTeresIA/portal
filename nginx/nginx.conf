events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Preserve original scheme when behind an upstream reverse proxy.
    map $http_x_forwarded_proto $origin_proto {
        default $scheme;
        ~*^https$ https;
        ~*^http$ http;
    }

    map $origin_proto $origin_ssl {
        default off;
        https on;
    }

    # Docker embedded DNS for dynamic upstream resolution.
    resolver 127.0.0.11 valid=5s ipv6=off;

    merge_slashes off;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # Basic settings
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 2048;
    client_max_body_size 500M;

    # Security headers
    add_header X-Frame-Options    SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";

    # Gzip
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript;

    # Unified entrypoint for local and remote deployments.
    # In remote, TLS can be terminated by an upstream proxy and requests forwarded
    # to this server on port 80 preserving X-Forwarded-Proto.
    server {
        listen 80;
        server_name _;

        location /nginx-health {
            access_log off;
            return 200 "nginx healthy\n";
            add_header Content-Type text/plain;
        }

        # Let's Encrypt HTTP-01 challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            try_files $uri =404;
        }

        # Public entry hub
        location = / {
            root /usr/share/nginx/html;
            try_files /hub/index.html =404;
        }

        location = /hub/config.js {
            default_type application/javascript;
            alias /tmp/hub-config.js;
        }

        location /hub/ {
            alias /usr/share/nginx/html/hub/;
            try_files $uri $uri/ /hub/index.html =404;
        }

        location = /favicon.ico {
            root /usr/share/nginx/html/hub;
            try_files /favicon.ico =404;
        }

        # Load per-application location blocks
        include /etc/nginx/conf.d/*.conf;
    }
}