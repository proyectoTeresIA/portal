events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Preserve original scheme when running behind an upstream reverse proxy.
    map $http_x_forwarded_proto $origin_proto {
        default $scheme;
        ~*^https$ https;
        ~*^http$ http;
    }

    merge_slashes off;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Basic settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 500M;

    # Security headers
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # ---------------------------------------------------------------------------
    # HTTP -> HTTPS redirect
    # ---------------------------------------------------------------------------
    server {
        listen 80;
        server_name _;

        location /nginx-health {
            access_log off;
            return 200 "nginx healthy\n";
            add_header Content-Type text/plain;
        }

        # ACME HTTP-01 challenges for Let's Encrypt
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            try_files $uri =404;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ---------------------------------------------------------------------------
    # HTTPS server
    # ---------------------------------------------------------------------------
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/tls.crt;
        ssl_certificate_key /etc/nginx/certs/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # -----------------------------------------------------------------------
        # Health check
        # -----------------------------------------------------------------------
        location /nginx-health {
            access_log off;
            return 200 "nginx healthy\n";
            add_header Content-Type text/plain;
        }

        location = /ontoportal {
            return 302 /ontoportal/;
        }

        # -----------------------------------------------------------------------
        # API 
        # -----------------------------------------------------------------------
        location /ontoportal/api/ {
            rewrite ^/ontoportal/api/(.*)$ /$1 break;

            proxy_pass http://api:9393;
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_set_header Host                $host;
            proxy_set_header X-Forwarded-Host    $host;
            proxy_set_header X-Forwarded-Port    $server_port;
            proxy_set_header X-Real-IP           $remote_addr;
            proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto   $origin_proto;
            proxy_set_header X-Forwarded-Ssl     on;
            proxy_set_header X-Forwarded-Scheme  $origin_proto;
            proxy_connect_timeout 60s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;

            # CORS
            add_header Access-Control-Allow-Origin  *;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization";

            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin  *;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
                add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization";
                add_header Access-Control-Max-Age   1728000;
                add_header Content-Type             'text/plain charset=UTF-8';
                add_header Content-Length           0;
                return 204;
            }
        }

        location /ontoportal/analytics {
            rewrite ^/ontoportal(/analytics.*)$ $1 break;
            proxy_pass http://api:9393;
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_set_header Host                $host;
            proxy_set_header X-Forwarded-Host    $host;
            proxy_set_header X-Forwarded-Port    $server_port;
            proxy_set_header X-Real-IP           $remote_addr;
            proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto   $origin_proto;
            proxy_set_header X-Forwarded-Ssl     on;
            proxy_set_header X-Forwarded-Scheme  $origin_proto;
            proxy_connect_timeout 60s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
        }

        location /ontoportal/static {
            rewrite ^/ontoportal(/static.*)$ $1 break;
            proxy_pass http://api:9393;
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_set_header Host                $host;
            proxy_set_header X-Forwarded-Host    $host;
            proxy_set_header X-Forwarded-Port    $server_port;
            proxy_set_header X-Real-IP           $remote_addr;
            proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto   $origin_proto;
            proxy_set_header X-Forwarded-Ssl     on;
            proxy_set_header X-Forwarded-Scheme  $origin_proto;
            proxy_connect_timeout 60s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
        }

        # -----------------------------------------------------------------------
        # Frontend Rails
        # -----------------------------------------------------------------------
        location /ontoportal/ {
            proxy_pass http://frontend:3000;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $origin_proto;
            proxy_set_header X-Forwarded-Ssl   on;
            # Inform Rack/Rails of base path
            proxy_set_header SCRIPT_NAME       /ontoportal;
            proxy_cookie_path / /ontoportal/;

            # Timeouts for big file uploads/downloads
            proxy_connect_timeout  300s;
            proxy_send_timeout     300s;
            proxy_read_timeout     300s;
            proxy_request_buffering off;
        }

    }
}